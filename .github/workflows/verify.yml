name: Verify Windrop
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/WinDrop.Protocol.Tests -c Release --nologo
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Windrop.sln -c Release --nologo --warnaserror
      - run: dotnet publish src/Windrop.App -c Release -r win-x64 --self-contained true -o publish/windows
      - uses: actions/upload-artifact@v4
        with:
          name: Windrop-windows-x64
          path: publish/windows
